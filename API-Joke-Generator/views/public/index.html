<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funny Jokes Generator</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>😄 Joke Generator</h1>
            <p class="subtitle">Need a laugh? We've got you covered!</p>
        </header>

        <main>
            <div class="joke-container">
                <div class="joke-text" id="jokeText">
                    Click the button to get a joke!
                </div>
                <div class="joke-delivery" id="jokeDelivery"></div>
            </div>

            <div class="controls">
                <select id="categorySelect" class="category-select">
                    <option value="Any">Random</option>
                    <option value="Programming">Programming</option>
                    <option value="Misc">Misc</option>
                    <option value="Dark">Dark</option>
                    <option value="Pun">Pun</option>
                    <option value="Spooky">Spooky</option>
                    <option value="Christmas">Christmas</option>
                </select>
                <button id="getJokeBtn" class="get-joke-btn">Get Joke</button>
            </div>
        </main>

        <footer>
            <p>Made with ❤️ using NestJS and JokeAPI</p>
        </footer>
    </div>

    <script>
        document.getElementById('getJokeBtn').addEventListener('click', async () => {
            const category = document.getElementById('categorySelect').value;
            const endpoint = category === 'Any' ? '/jokes' : `/jokes/${category}`;
            
            try {
                const response = await fetch(endpoint);
                const joke = await response.json();
                
                const jokeText = document.getElementById('jokeText');
                const jokeDelivery = document.getElementById('jokeDelivery');
                
                if (joke.type === 'single') {
                    jokeText.textContent = joke.joke;
                    jokeDelivery.textContent = '';
                } else {
                    jokeText.textContent = joke.setup;
                    jokeDelivery.textContent = joke.delivery;
                }
            } catch (error) {
                console.error('Error fetching joke:', error);
            }
        });
    </script>
</body>
</html>
